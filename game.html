<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Night Owl</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: linear-gradient(#0a1128, #1c2541);
    font-family: 'Trebuchet MS', Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  #gameContainer {
    position: relative;
    box-shadow: 0 0 30px rgba(0,0,0,0.4);
  }

  canvas {
    display: block;
    background: linear-gradient(#0d1b3e, #2c3e6b);
  }

  #overlay {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    color: #fff;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
    text-align: center;
    user-select: none;
  }

  #overlay h1 {
    font-size: 42px;
    margin: 0 0 10px 0;
    letter-spacing: 2px;
  }

  #overlay p {
    font-size: 18px;
    margin: 6px 0;
  }

  #overlay button {
    margin-top: 18px;
    padding: 10px 26px;
    font-size: 18px;
    border: none;
    border-radius: 8px;
    background: #ffcc00;
    color: #5a3e00;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 4px 0 #b58a00;
    transition: transform 0.05s;
  }

  #overlay button:active {
    transform: translateY(4px);
    box-shadow: 0 0 0 #b58a00;
  }

  #scoreDisplay {
    position: absolute;
    top: 14px;
    left: 0;
    width: 100%;
    text-align: center;
    font-size: 36px;
    color: #fff;
    font-weight: bold;
    text-shadow: 2px 2px 3px rgba(0,0,0,0.5);
    pointer-events: none;
  }

  .hidden { display: none !important; }
</style>
</head>
<body>

<div id="gameContainer">
  <canvas id="game" width="400" height="600"></canvas>
  <div id="scoreDisplay">0</div>
  <div id="overlay">
    <h1>Night Owl</h1>
    <p>Tap, click, or press Space to flap</p>
    <p>Don't hit the pipes or the ground!</p>
    <button id="startBtn">Start Game</button>
  </div>
</div>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');
const scoreDisplay = document.getElementById('scoreDisplay');

const W = canvas.width;
const H = canvas.height;

// Game constants
const GRAVITY = 0.34;
const FLAP_STRENGTH = -6.8;
const PIPE_WIDTH = 70;
const PIPE_GAP = 160;
const PIPE_SPEED = 2.0;
const PIPE_SPACING = 220;
const GROUND_HEIGHT = 80;

let bird, pipes, frame, score, best, gameState;
best = Number(localStorage.getItem('nightOwlBest') || 0);

function resetGame() {
  bird = {
    x: 90,
    y: H / 2,
    vy: 0,
    radius: 16,
    rotation: 0
  };
  pipes = [];
  frame = 0;
  score = 0;
  gameState = 'ready'; // ready, playing, gameover
  scoreDisplay.textContent = '0';
  spawnInitialPipes();
}

function spawnInitialPipes() {
  for (let i = 0; i < 3; i++) {
    addPipe(W + i * PIPE_SPACING);
  }
}

function addPipe(x) {
  const minTop = 40;
  const maxTop = H - GROUND_HEIGHT - PIPE_GAP - 40;
  const topHeight = Math.random() * (maxTop - minTop) + minTop;
  pipes.push({
    x: x,
    top: topHeight,
    bottom: topHeight + PIPE_GAP,
    passed: false
  });
}

function flap() {
  if (gameState === 'ready') {
    gameState = 'playing';
    overlay.classList.add('hidden');
  }
  if (gameState === 'playing') {
    bird.vy = FLAP_STRENGTH;
  }
  if (gameState === 'gameover') {
    // ignore, restart handled by button
  }
}

function update() {
  if (gameState !== 'playing') return;
  frame++;

  bird.vy += GRAVITY;
  bird.y += bird.vy;
  bird.rotation = Math.max(-0.5, Math.min(1.3, bird.vy / 10));

  // Move pipes
  for (const p of pipes) {
    p.x -= PIPE_SPEED;
  }

  // Recycle pipes
  if (pipes.length && pipes[0].x + PIPE_WIDTH < 0) {
    pipes.shift();
    const lastX = pipes[pipes.length - 1].x;
    addPipe(lastX + PIPE_SPACING);
  }

  // Score
  for (const p of pipes) {
    if (!p.passed && p.x + PIPE_WIDTH < bird.x) {
      p.passed = true;
      score++;
      scoreDisplay.textContent = score;
    }
  }

  // Collisions: ground / ceiling
  if (bird.y + bird.radius >= H - GROUND_HEIGHT || bird.y - bird.radius <= 0) {
    endGame();
    return;
  }

  // Collisions: pipes
  for (const p of pipes) {
    const withinX = bird.x + bird.radius > p.x && bird.x - bird.radius < p.x + PIPE_WIDTH;
    if (withinX) {
      const hitsTop = bird.y - bird.radius < p.top;
      const hitsBottom = bird.y + bird.radius > p.bottom;
      if (hitsTop || hitsBottom) {
        endGame();
        return;
      }
    }
  }
}

function endGame() {
  gameState = 'gameover';
  if (score > best) {
    best = score;
    localStorage.setItem('nightOwlBest', best);
  }
  showOverlay();
}

function showOverlay() {
  overlay.innerHTML = `
    <h1>${gameState === 'gameover' ? 'Game Over' : 'Night Owl'}</h1>
    ${gameState === 'gameover' ? `<p>Score: ${score}</p><p>Best: ${best}</p>` : `<p>Tap, click, or press Space to flap</p><p>Don't hit the pipes or the ground!</p>`}
    <button id="startBtn">${gameState === 'gameover' ? 'Play Again' : 'Start Game'}</button>
  `;
  overlay.classList.remove('hidden');
  document.getElementById('startBtn').addEventListener('click', (e) => {
    e.stopPropagation();
    resetGame();
    gameState = 'playing';
    overlay.classList.add('hidden');
  });
}

const stars = [];
for (let i = 0; i < 60; i++) {
  stars.push({
    x: Math.random() * W,
    y: Math.random() * (H - GROUND_HEIGHT - 40),
    r: Math.random() * 1.6 + 0.4,
    twinkleOffset: Math.random() * Math.PI * 2
  });
}

function drawBackground() {
  // Moon
  ctx.save();
  ctx.fillStyle = '#f4f1d3';
  ctx.shadowColor = 'rgba(244,241,211,0.6)';
  ctx.shadowBlur = 25;
  ctx.beginPath();
  ctx.arc(W - 70, 80, 34, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
  // moon craters
  ctx.fillStyle = 'rgba(210,205,170,0.5)';
  ctx.beginPath();
  ctx.arc(W - 80, 70, 5, 0, Math.PI * 2);
  ctx.arc(W - 60, 90, 4, 0, Math.PI * 2);
  ctx.arc(W - 65, 65, 3, 0, Math.PI * 2);
  ctx.fill();

  // Stars
  for (const s of stars) {
    const twinkle = 0.5 + 0.5 * Math.sin(frame * 0.05 + s.twinkleOffset);
    ctx.fillStyle = `rgba(255,255,255,${0.4 + twinkle * 0.6})`;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }

  // Distant silhouette hills
  ctx.fillStyle = '#141b3d';
  ctx.beginPath();
  ctx.moveTo(0, H - GROUND_HEIGHT);
  ctx.lineTo(0, H - GROUND_HEIGHT - 50);
  ctx.lineTo(60, H - GROUND_HEIGHT - 80);
  ctx.lineTo(140, H - GROUND_HEIGHT - 40);
  ctx.lineTo(220, H - GROUND_HEIGHT - 90);
  ctx.lineTo(300, H - GROUND_HEIGHT - 45);
  ctx.lineTo(380, H - GROUND_HEIGHT - 75);
  ctx.lineTo(W, H - GROUND_HEIGHT - 35);
  ctx.lineTo(W, H - GROUND_HEIGHT);
  ctx.closePath();
  ctx.fill();
}

function drawGround() {
  ctx.fillStyle = '#3a3622';
  ctx.fillRect(0, H - GROUND_HEIGHT, W, GROUND_HEIGHT);
  ctx.fillStyle = '#2f4a23';
  ctx.fillRect(0, H - GROUND_HEIGHT, W, 14);
  // simple grass texture lines
  ctx.strokeStyle = '#1f3318';
  ctx.lineWidth = 2;
  for (let x = 0; x < W; x += 16) {
    ctx.beginPath();
    ctx.moveTo(x, H - GROUND_HEIGHT);
    ctx.lineTo(x + 4, H - GROUND_HEIGHT - 8);
    ctx.stroke();
  }
}

function drawPipes() {
  for (const p of pipes) {
    // top pipe
    ctx.fillStyle = '#2e4a36';
    ctx.fillRect(p.x, 0, PIPE_WIDTH, p.top);
    ctx.fillStyle = '#23392a';
    ctx.fillRect(p.x - 4, p.top - 24, PIPE_WIDTH + 8, 24);

    // bottom pipe
    ctx.fillStyle = '#2e4a36';
    ctx.fillRect(p.x, p.bottom, PIPE_WIDTH, H - GROUND_HEIGHT - p.bottom);
    ctx.fillStyle = '#23392a';
    ctx.fillRect(p.x - 4, p.bottom, PIPE_WIDTH + 8, 24);

    // outline
    ctx.strokeStyle = '#0f1f14';
    ctx.lineWidth = 2;
    ctx.strokeRect(p.x, 0, PIPE_WIDTH, p.top);
    ctx.strokeRect(p.x, p.bottom, PIPE_WIDTH, H - GROUND_HEIGHT - p.bottom);
  }
}

function drawBird() {
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.rotation);

  const r = bird.radius;
  const wingFlap = Math.sin(frame * 0.4) * 4;

  // ear tufts
  ctx.fillStyle = '#5a4a3a';
  ctx.beginPath();
  ctx.moveTo(-r * 0.55, -r * 0.85);
  ctx.lineTo(-r * 0.75, -r * 1.5);
  ctx.lineTo(-r * 0.25, -r * 1.0);
  ctx.closePath();
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(r * 0.55, -r * 0.85);
  ctx.lineTo(r * 0.75, -r * 1.5);
  ctx.lineTo(r * 0.25, -r * 1.0);
  ctx.closePath();
  ctx.fill();

  // body/neck ruffle behind head
  ctx.fillStyle = '#6b5640';
  ctx.beginPath();
  ctx.ellipse(0, r * 0.4 + wingFlap * 0.3, r * 1.05, r * 0.7, 0, 0, Math.PI * 2);
  ctx.fill();

  // round head/facial disc
  ctx.fillStyle = '#8a7156';
  ctx.beginPath();
  ctx.arc(0, 0, r * 1.05, 0, Math.PI * 2);
  ctx.fill();

  // lighter facial disc (the flat owl face)
  ctx.fillStyle = '#d9c9a3';
  ctx.beginPath();
  ctx.ellipse(0, r * 0.05, r * 0.85, r * 0.8, 0, 0, Math.PI * 2);
  ctx.fill();

  // crown speckles
  ctx.fillStyle = '#6b5640';
  ctx.beginPath();
  ctx.arc(-r * 0.5, -r * 0.7, r * 0.12, 0, Math.PI * 2);
  ctx.arc(r * 0.1, -r * 0.85, r * 0.1, 0, Math.PI * 2);
  ctx.arc(r * 0.5, -r * 0.65, r * 0.12, 0, Math.PI * 2);
  ctx.fill();

  // eye patches (dark rings around big eyes)
  ctx.fillStyle = '#3d3325';
  ctx.beginPath();
  ctx.arc(-r * 0.38, -r * 0.05, r * 0.42, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(r * 0.38, -r * 0.05, r * 0.42, 0, Math.PI * 2);
  ctx.fill();

  // big round eyes
  ctx.fillStyle = '#ffd34d';
  ctx.beginPath();
  ctx.arc(-r * 0.38, -r * 0.05, r * 0.32, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(r * 0.38, -r * 0.05, r * 0.32, 0, Math.PI * 2);
  ctx.fill();

  // pupils
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.arc(-r * 0.34, -r * 0.02, r * 0.15, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(r * 0.42, -r * 0.02, r * 0.15, 0, Math.PI * 2);
  ctx.fill();

  // eye shine
  ctx.fillStyle = '#fff';
  ctx.beginPath();
  ctx.arc(-r * 0.42, -r * 0.1, r * 0.05, 0, Math.PI * 2);
  ctx.arc(r * 0.34, -r * 0.1, r * 0.05, 0, Math.PI * 2);
  ctx.fill();

  // small curved beak
  ctx.fillStyle = '#4a3a2a';
  ctx.beginPath();
  ctx.moveTo(-r * 0.13, r * 0.25);
  ctx.lineTo(r * 0.13, r * 0.25);
  ctx.quadraticCurveTo(r * 0.1, r * 0.55, 0, r * 0.62);
  ctx.quadraticCurveTo(-r * 0.1, r * 0.55, -r * 0.13, r * 0.25);
  ctx.closePath();
  ctx.fill();

  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  drawBackground();
  drawPipes();
  drawGround();
  drawBird();
}

function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}

// Input handling
window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    e.preventDefault();
    flap();
  }
});
canvas.addEventListener('mousedown', flap);
canvas.addEventListener('touchstart', (e) => {
  e.preventDefault();
  flap();
}, { passive: false });

startBtn.addEventListener('click', () => {
  resetGame();
  gameState = 'playing';
  overlay.classList.add('hidden');
});

resetGame();
loop();
</script>
</body>
</html>
